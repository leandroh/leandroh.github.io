<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>parazito</title>
  <script>
    (function () {
      var lang = (navigator.language || navigator.userLanguage || '').toLowerCase();
      var target = lang.indexOf('pt') === 0 ? '/br/' : '/en/';
      window.location.replace(target);
    })();
  </script>
  <meta http-equiv="refresh" content="0;url=/en/">
  <style>
    body { font-family: 'JetBrains Mono', Menlo, Consolas, Monaco, monospace; background: #1a1b1e; color: rgb(196, 196, 197); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    a { color: rgb(120, 180, 200); margin: 0 0.5rem; }
  </style>
</head>
<body>
  <p>Redirecting <a href="/en/">English</a> | <a href="/br/">Português</a></p>
</body>
</html>
